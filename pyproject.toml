[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentbrain"
version = "1.0.0"
description = "The shared brain for AI agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
]
