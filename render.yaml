services:
  - type: web
    name: agentbrain-auth
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn auth_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        value: price_1U5OUhDxZTiv22XcmA4OF2ds
      - key: STRIPE_TEAM_PRICE_ID
        value: price_1U5OUjDxZTiv22Xck71tvMPu
      - key: PYTHON_VERSION
        value: 3.11.0
  - type: postgres
    name: agentbrain-db
    plan: free
    ipAllowList: []
