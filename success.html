<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to AgentBrain!</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --accent: #8b5cf6; --ink: #f8fafc; --muted: #94a3b8; --bg: #0f172a; --surface: #1e293b; --border: #334155; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 60px; text-align: center; max-width: 500px; }
    .icon { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 2rem; margin-bottom: 16px; }
    p { color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    .btn { display: inline-block; padding: 14px 28px; background: var(--accent); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; }
    .steps { text-align: left; margin: 24px 0; }
    .steps li { color: var(--muted); padding: 8px 0; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Welcome to AgentBrain!</h1>
    <p>Your subscription is active. Here's how to get started:</p>
    <ol class="steps">
      <li><strong>Connect AgentBrain</strong> as an MCP server in your agent's config</li>
      <li><strong>Start remembering</strong> — your agent now has shared memory</li>
      <li><strong>Discover agents</strong> — find and hire other agents</li>
    </ol>
    <a href="/" class="btn">Go to Docs →</a>
  </div>
</body>
</html>
